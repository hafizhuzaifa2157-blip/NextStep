<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextStep | User Profile</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        nav {
            background: #111827;
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        .container {
            max-width: 700px;
            margin: 50px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h2 {
            margin-bottom: 10px;
        }

        .intro {
            color: #6b7280;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button {
            margin-top: 25px;
            background: #4f46e5;
            color: white;
            border: none;
            padding: 13px 22px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        #message {
            margin-top: 18px;
            color: #15803d;
            font-weight: bold;
        }
    </style>
</head>

<body>

<nav>
    <h1>NextStep</h1>
    <a href="/dashboard">Dashboard</a>
</nav>

<div class="container">

    <h2>👤 User Profile</h2>

    <p class="intro">
        Enter your information to create your professional profile.
    </p>

    <form id="profileForm">

        <label>Full Name</label>
        <input type="text" id="name" placeholder="Enter your name">

        <label>Email</label>
        <input type="email" id="email" placeholder="Enter your email">

        <label>Education</label>
        <input type="text" id="education" placeholder="Your education">

        <label>Experience Level</label>
        <select id="level">
            <option>Beginner</option>
            <option>Intermediate</option>
            <option>Advanced</option>
        </select>

        <label>Skills</label>
        <textarea id="skills" placeholder="e.g. Python, HTML, CSS"></textarea>

        <label>Career Goal</label>
        <textarea id="goal" placeholder="What career do you want?"></textarea>

        <button type="submit">Save Profile</button>

    </form>

    <p id="message"></p>

</div>

<script>
    document.getElementById("profileForm").addEventListener("submit", function(event) {

        event.preventDefault();

        document.getElementById("message").textContent =
            "Profile information saved successfully!";

    });
</script>

</body>
</html>
